schema: hydra-rsi/1
# Committed bytes of the browser extension users install, and of the main content script injected into every YouTube page.
metrics:
  - id: extension.shipped_bytes
    kind: size
    better: lower
    unit: bytes
    measure: "python scripts/rsi/shipped_bytes.py"
    pick: 'extension_bytes=(\d+)'
    gate: exact
    light: true
  - id: extension.userscript_bytes
    kind: size
    better: lower
    unit: bytes
    measure: "python scripts/rsi/shipped_bytes.py"
    pick: 'userscript_bytes=(\d+)'
    gate: exact
    light: true
